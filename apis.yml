aid: brewdog
name: BrewDog
description: 'BrewDog PLC (company no. SC311560) is a Scottish craft brewer, bar and
  hotel operator headquartered at Balmacassie Commercial Park, Ellon, Aberdeenshire,
  known for Punk IPA, Hazy Jane and Lost Lager, its Equity for Punks crowdfunding
  rounds, and its openly published DIY Dog recipe archive. BrewDog does not run a
  conventional developer program, but its direct-to-consumer store at brewdog.com
  is a Shopify storefront that ships a real agent-facing API surface: a published
  /llms.txt and /agents.md, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, a UCP-over-MCP endpoint at /api/ucp/mcp, Shopify Customer Account
  OpenID Connect discovery at /.well-known/openid-configuration, and unauthenticated
  read-only storefront product JSON endpoints that BrewDog documents for agents itself.'
url: https://raw.githubusercontent.com/api-evangelist/brewdog/refs/heads/main/apis.yml

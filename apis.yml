apis:
- name: BrewDog Agentic Commerce (UCP over MCP)
  description: 'BrewDog''s Universal Commerce Protocol shopping service, exposed over
    MCP at https://brewdog.com/api/ucp/mcp and advertised by the store''s own
    /.well-known/ucp merchant profile and /agents.md. Supports UCP versions 2026-04-08
    and 2026-01-23 with the cart, checkout, fulfillment, discount, order and catalog
    search/lookup capabilities. tools/list is gated on an agent profile URI, so the
    live tool schemas require an identified agent; the tool set is declared by the
    OpenRPC schema the merchant profile points at.'
  humanURL: https://brewdog.com/agents.md
  baseURL: https://brewdog.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - UCP
  - Shopping
  - Checkout
  properties:
  - type: MCPServer
    url: mcp/brewdog-mcp.yml
  - type: WellKnown
    url: well-known/brewdog-well-known.yml
- name: BrewDog Storefront Product JSON
  description: 'The unauthenticated, read-only product and collection JSON surface of
    the brewdog.com Shopify storefront, documented by BrewDog for agents in
    /llms.txt and /agents.md: GET /products.json, GET /products/{handle}.json,
    GET /collections/{handle}/products.json and GET /search?q={query}&type=product.
    No API key is required and no OpenAPI description is published.'
  humanURL: https://brewdog.com/agents.md
  baseURL: https://brewdog.com
  tags:
  - Products
  - Catalog
  - Retail
  - JSON
  - Read Only
  properties:
  - type: Examples
    url: examples/brewdog-products-json.json
  - type: DataModel
    url: data-model/brewdog-data-model.yml
